<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<meta name="mobile-web-app-capable" content="yes">
<title>Zen Text Order ⛩️ + Daruma 🌰</title>
<style>
  :root {
    --washi:   #f2e8d5;
    --washi-2: #e8dcc3;
    --sumi:    #2b2118;
    --shu:     #9e2b25;
    --kin:     #b08d57;
    --ai:      #2f4858;
    --card-bg: #faf4e6;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    touch-action: manipulation;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'Songti SC', 'MS Mincho', Georgia, serif;
    background-color: var(--washi);
    background-image:
      radial-gradient(circle at 100% 50%, transparent 20%, rgba(47,72,88,.07) 21%, rgba(47,72,88,.07) 24%, transparent 25%, transparent 32%, rgba(47,72,88,.07) 33%, rgba(47,72,88,.07) 36%, transparent 37%),
      radial-gradient(circle at 0% 50%, transparent 20%, rgba(47,72,88,.07) 21%, rgba(47,72,88,.07) 24%, transparent 25%, transparent 32%, rgba(47,72,88,.07) 33%, rgba(47,72,88,.07) 36%, transparent 37%),
      repeating-linear-gradient(90deg, rgba(43,33,24,.020) 0 1px, transparent 1px 3px);
    background-size: 46px 46px, 46px 46px, auto;
    background-position: 0 0, 0 -23px, 0 0;
    color: var(--sumi);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; padding-bottom: calc(20px + var(--safe-bottom));
    text-align: center;
    -webkit-user-select: none; user-select: none;
  }

  /* ===== SETUP ===== */
  #setup {
    text-align: center; width: 100%; max-width: 500px;
    padding: 26px 22px 24px;
    background: linear-gradient(180deg, var(--card-bg), var(--washi-2));
    border: 1px solid var(--kin);
    border-top: 6px solid var(--sumi);
    border-bottom: 6px solid var(--sumi);
    border-radius: 3px;
    box-shadow: 0 6px 18px rgba(43,33,24,.18), inset 0 0 0 1px rgba(176,141,87,.35);
  }
  #setup h2 {
    font-weight: 500; letter-spacing: .28em;
    color: var(--shu); font-size: 1.15rem;
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: 1px solid rgba(176,141,87,.55);
  }
  textarea {
    width: 100%; height: 150px;
    background: #fdf9ef; color: var(--sumi);
    border: 1px solid var(--kin); padding: 12px; margin-bottom: 15px;
    border-radius: 2px; font-size: 16px;
    font-family: inherit; line-height: 1.7;
    box-shadow: inset 0 1px 4px rgba(43,33,24,.10);
    background-image: repeating-linear-gradient(180deg, transparent 0 26px, rgba(176,141,87,.22) 26px 27px);
    -webkit-user-select: text; user-select: text;
  }
  textarea::placeholder { color: rgba(43,33,24,.42); font-style: italic; }
  textarea:focus { outline: 2px solid var(--shu); outline-offset: 2px; }

  /* ===== GAME ===== */
  #game { display: none; width: 100%; max-width: 600px; padding: 20px 0; }

  .exercise {
    margin-bottom: 25px; padding: 20px;
    background: linear-gradient(180deg, var(--card-bg), var(--washi-2));
    border: 1px solid var(--kin);
    border-radius: 3px;
    box-shadow: 0 4px 12px rgba(43,33,24,.12);
  }
  .exercise-title {
    font-size: 0.9rem; color: var(--ai);
    margin-bottom: 15px; letter-spacing: .1em;
    border-bottom: 1px solid rgba(176,141,87,.4);
    padding-bottom: 8px;
  }
  .target-zone {
    min-height: 70px; padding: 15px; margin-bottom: 20px;
    background: rgba(255,255,255,.4);
    border: 2px dashed var(--kin);
    border-radius: 3px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 8px rgba(43,33,24,.08);
  }
  .target-zone.empty::before {
    content: 'Ordena las palabras aquí...';
    color: rgba(43,33,24,.35); font-style: italic; font-size: 0.9rem;
  }
  .words-zone {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    padding: 15px;
    background: rgba(255,255,255,.3);
    border: 1px solid var(--kin);
    border-radius: 3px;
  }
  .word-chip {
    padding: 10px 16px;
    background: linear-gradient(180deg, #b23a2f, var(--shu));
    color: var(--washi);
    border: 1px solid var(--kin);
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.95rem; font-weight: 600;
    letter-spacing: .05em;
    box-shadow: 0 3px 0 #6f1c18, 0 4px 10px rgba(43,33,24,.2);
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .word-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #6f1c18; }
  .word-chip.in-target {
    background: linear-gradient(180deg, var(--card-bg), var(--washi-2));
    color: var(--sumi);
    border-color: var(--sumi);
    box-shadow: 0 2px 0 rgba(43,33,24,.35), inset 0 0 0 2px rgba(176,141,87,.30);
  }
  .word-chip.correct {
    background: linear-gradient(180deg, #4a7c59, #3d6b4a);
    border-color: #2d5239;
    box-shadow: 0 3px 0 #2d5239;
  }
  .word-chip.wrong { animation: shake .4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}
  }

  .exercise-message {
    text-align: center; margin-top: 15px; padding: 12px;
    font-size: 1rem; font-weight: 600;
    border-radius: 3px; display: none;
  }
  .exercise-message.success {
    background: linear-gradient(180deg, #4a7c59, #3d6b4a);
    color: var(--washi); border: 1px solid #2d5239;
  }
  .exercise-controls { display: flex; gap: 10px; margin-top: 15px; }
  .exercise-controls button { flex: 1; padding: 12px; font-size: 0.9rem; letter-spacing: .1em; min-height: 44px; }

  button {
    background: linear-gradient(180deg, #b23a2f, var(--shu));
    color: var(--washi); border: 1px solid var(--kin);
    padding: 15px 25px; font-weight: 600; border-radius: 2px;
    cursor: pointer; width: 100%; font-size: 1rem;
    font-family: inherit; letter-spacing: .18em;
    box-shadow: 0 3px 0 #6f1c18, 0 5px 12px rgba(43,33,24,.22);
    min-height: 48px;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 #6f1c18; }
  .secondary-btn {
    background: linear-gradient(180deg, var(--card-bg), var(--washi-2));
    color: var(--sumi); border: 1px solid var(--sumi); width: auto;
    box-shadow: 0 2px 0 rgba(43,33,24,.35), inset 0 0 0 2px rgba(176,141,87,.30);
  }
  .controls { display: flex; gap: 10px; margin-top: 20px; }
  .controls button { flex: 1; }

  /* ===== DARUMA ===== */
  .daruma-section {
    width: 100%; max-width: 500px;
    margin-top: 30px; padding: 20px;
    background: linear-gradient(180deg, var(--card-bg), var(--washi-2));
    border: 1px solid var(--kin);
    border-radius: 3px;
    box-shadow: 0 4px 12px rgba(43,33,24,.12);
  }
  .daruma-section h3 {
    color: var(--shu); letter-spacing: .2em;
    font-size: 1rem; font-weight: 500;
    margin-bottom: 10px;
  }
  .instrucciones {
    background: rgba(176,141,87,.15); padding: 10px 20px;
    border-radius: 15px; margin-bottom: 15px;
    color: var(--ai); font-size: 0.9em;
    border: 1px solid rgba(176,141,87,.4);
  }
  .contador {
    background: rgba(255,255,255,.8); padding: 10px 25px; border-radius: 25px;
    margin: 10px auto; font-size: 1.2em; color: var(--ai);
    border: 2px solid var(--kin); display: inline-block;
  }
  .contador span { color: var(--shu); font-weight: bold; }

  .daruma-container {
    width: 240px; height: 260px; margin: 15px auto;
    display: flex; align-items: center; justify-content: center;
    border: 4px dashed var(--kin); border-radius: 50%;
    background: rgba(255,255,255,.3);
    transition: all 0.3s;
    position: relative;
  }
  .daruma-container.activo {
    border-color: var(--shu); background: rgba(158,43,37,.1);
    transform: scale(1.05); box-shadow: 0 0 30px rgba(158,43,37,.3);
  }
  .daruma-img {
    width: 200px; height: auto;
    transition: transform 0.3s;
    filter: drop-shadow(0 8px 16px rgba(43,33,24,.25));
    animation: balanceo 2s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  .daruma-img.comiendo { animation: comer 0.6s ease; }
  .daruma-img.feliz { animation: saltar 0.8s ease infinite; }
  @keyframes balanceo { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes comer { 0%{transform:scale(1)} 30%{transform:scale(1.2) rotate(-5deg)} 60%{transform:scale(1.15) rotate(5deg)} 100%{transform:scale(1)} }
  @keyframes saltar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

  .semillas-container {
    background: rgba(255,255,255,.7);
    padding: 15px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(43,33,24,.1);
    width: 100%; max-width: 360px; margin: 15px auto;
    overflow: hidden;
  }
  .semillas {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .semilla {
    font-size: 1.8em;
    cursor: grab;
    transition: transform 0.2s, opacity 0.3s;
    background: rgba(255,255,255,.9);
    border-radius: 50%;
    padding: 5px;
    box-shadow: 0 2px 6px rgba(43,33,24,.1);
    border: 2px solid transparent;
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    min-height: 44px; min-width: 44px;
    touch-action: none; /* CRÍTICO: permite arrastre táctil sin scroll */
    position: relative;
    z-index: 1;
  }
  .semilla:hover { transform: scale(1.15); border-color: var(--kin); }
  .semilla.dragging { opacity: 0.4; }
  .semilla.comida { opacity: 0.15; cursor: not-allowed; transform: scale(0.7); pointer-events: none; }

  /* Clon que sigue al dedo/mouse durante el arrastre */
  .seed-clone {
    position: fixed;
    font-size: 2.2em;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%) scale(1.3);
    filter: drop-shadow(0 4px 8px rgba(43,33,24,.4));
    transition: transform 0.15s ease;
  }

  .mensaje {
    margin-top: 20px; font-size: 1.1em; color: var(--ai); font-weight: bold;
    padding: 10px 20px; background: rgba(255,255,255,.7);
    border-radius: 15px; min-height: 45px;
    border: 1px solid rgba(176,141,87,.4);
  }
  .victoria {
    background: linear-gradient(45deg, var(--kin), var(--shu), var(--ai));
    color: var(--washi);
    padding: 25px 30px; border-radius: 20px; font-size: 1.2em;
    margin-top: 20px;
    animation: brillar 1.5s ease-in-out infinite;
    display: none;
    border: 2px solid var(--kin);
  }
  @keyframes brillar { 0%,100%{box-shadow:0 0 20px var(--kin)} 50%{box-shadow:0 0 40px var(--shu)} }

  .btn-reiniciar {
    margin-top: 15px; padding: 12px 30px;
    background: var(--shu); color: var(--washi);
    border: 1px solid var(--kin); border-radius: 25px;
    font-size: 1.1em; cursor: pointer; display: none;
    width: auto; font-family: inherit; letter-spacing: .1em;
    min-height: 48px;
  }

  @media (prefers-reduced-motion: reduce) {
    .word-chip, button, .daruma-img, .semilla { transition: none; }
    .word-chip.wrong, .daruma-img.comiendo, .daruma-img.feliz { animation: none; }
    .daruma-img { animation: none; }
  }

  @media (max-width: 480px) {
    .daruma-container { width: 200px; height: 220px; }
    .daruma-img { width: 170px; }
    .semilla { font-size: 1.5em; }
  }
</style>
</head>
<body>

  <div id="setup">
    <h2>TEXT ORDER ⛩️</h2>
    <textarea id="inputTexto" placeholder="Escribe una oración por línea..."></textarea>
    <button onclick="generar()">COMENZAR</button>
  </div>

  <div id="game">
    <div id="exercisesContainer"></div>
    <div class="controls">
      <button class="secondary-btn" onclick="location.reload()">← NUEVO</button>
    </div>

    <!-- Sección Daruma -->
    <div class="daruma-section">
      <h3>🎎 DARUMA HAMBRIENTO 🌰</h3>
      <div class="instrucciones">👆 Arrastra cada semilla 🌰 hasta el círculo (PC y móvil)</div>
      <div class="contador">Semillas: <span id="contador">0</span> / 10</div>

      <div class="daruma-container" id="zonaDrop">
        <img src="tu-imagen.png" alt="Daruma" class="daruma-img" id="daruma">
      </div>

      <div class="semillas-container">
        <div class="semillas" id="semillas"></div>
      </div>

      <div class="mensaje" id="mensaje">¡Alimenta al daruma arrastrando las semillas!</div>
      <div class="victoria" id="victoria">🎉 ¡Daruma está feliz y lleno! 🎉<br>¡Completaste el juego! 🌸✨</div>
      <button class="btn-reiniciar" id="btnReiniciar">🔄 Jugar de nuevo</button>
    </div>
  </div>

<script>
  // ===== EJERCICIOS =====
  let ejercicios = [];

  function mezclar(arr) {
    const copia = [...arr];
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function vibrar(ms = 30) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function generar() {
    const texto = document.getElementById('inputTexto').value.trim();
    if (!texto) return;
    const lineas = texto.split('\n').filter(l => l.trim());
    if (lineas.length === 0) return;

    ejercicios = lineas.map((linea, idx) => ({
      id: idx,
      original: linea.trim().split(/\s+/),
      mezcladas: mezclar(linea.trim().split(/\s+/)),
      ordenUsuario: [],
      completado: false
    }));

    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    renderizarEjercicios();
    inicializarDaruma();
  }

  function renderizarEjercicios() {
    const container = document.getElementById('exercisesContainer');
    container.innerHTML = '';
    ejercicios.forEach((ej, ejIdx) => {
      const exerciseDiv = document.createElement('div');
      exerciseDiv.className = 'exercise';
      exerciseDiv.innerHTML = `
        <div class="exercise-title">Oración ${ejIdx + 1}</div>
        <div class="target-zone ${ej.ordenUsuario.length === 0 ? 'empty' : ''}" id="target-${ejIdx}"></div>
        <div class="words-zone" id="words-${ejIdx}"></div>
        <div class="exercise-message" id="message-${ejIdx}"></div>
        <div class="exercise-controls">
          <button class="secondary-btn" onclick="reiniciarEjercicio(${ejIdx})">🔄 REPETIR</button>
        </div>`;
      container.appendChild(exerciseDiv);
      renderizarEjercicio(ejIdx);
    });
  }

  function renderizarEjercicio(ejIdx) {
    const ej = ejercicios[ejIdx];
    const targetZone = document.getElementById(`target-${ejIdx}`);
    const wordsZone = document.getElementById(`words-${ejIdx}`);
    targetZone.innerHTML = ''; wordsZone.innerHTML = '';

    if (ej.ordenUsuario.length === 0) {
      targetZone.classList.add('empty');
    } else {
      targetZone.classList.remove('empty');
      ej.ordenUsuario.forEach((item, idx) => {
        const chip = document.createElement('div');
        chip.className = 'word-chip in-target';
        chip.textContent = item.palabra;
        chip.onclick = () => quitarPalabra(ejIdx, idx);
        targetZone.appendChild(chip);
      });
    }

    ej.mezcladas.forEach((palabra, idx) => {
      if (!ej.ordenUsuario.some(item => item.idx === idx)) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.textContent = palabra;
        chip.onclick = () => agregarPalabra(ejIdx, palabra, idx);
        wordsZone.appendChild(chip);
      }
    });
  }

  function agregarPalabra(ejIdx, palabra, palabraIdx) {
    ejercicios[ejIdx].ordenUsuario.push({ palabra, idx: palabraIdx });
    ejercicios[ejIdx].completado = false;
    renderizarEjercicio(ejIdx);
    verificar(ejIdx);
  }
  function quitarPalabra(ejIdx, posicion) {
    ejercicios[ejIdx].ordenUsuario.splice(posicion, 1);
    ejercicios[ejIdx].completado = false;
    renderizarEjercicio(ejIdx);
  }
  function verificar(ejIdx) {
    const ej = ejercicios[ejIdx];
    if (ej.ordenUsuario.length !== ej.original.length) return;
    const usuario = ej.ordenUsuario.map(item => item.palabra);
    const correcto = usuario.every((p, i) => p === ej.original[i]);
    const message = document.getElementById(`message-${ejIdx}`);
    if (correcto) {
      message.textContent = '✓ ¡Perfecto! 完璧';
      message.className = 'exercise-message success';
      message.style.display = 'block';
      document.querySelectorAll(`#target-${ejIdx} .word-chip`).forEach(c => c.classList.add('correct'));
      ej.completado = true;
      vibrar(50);
    } else {
      message.textContent = '✗ Intenta de nuevo...';
      message.className = 'exercise-message';
      message.style.display = 'block';
      vibrar([30,50,30]);
      setTimeout(() => {
        message.style.display = 'none';
        document.querySelectorAll(`#target-${ejIdx} .word-chip`).forEach(c => c.classList.add('wrong'));
        setTimeout(() => {
          ej.ordenUsuario = []; ej.completado = false;
          renderizarEjercicio(ejIdx);
        }, 600);
      }, 1000);
    }
  }
  function reiniciarEjercicio(ejIdx) {
    ejercicios[ejIdx].ordenUsuario = [];
    ejercicios[ejIdx].completado = false;
    ejercicios[ejIdx].mezcladas = mezclar(ejercicios[ejIdx].original);
    document.getElementById(`message-${ejIdx}`).style.display = 'none';
    renderizarEjercicio(ejIdx);
    vibrar(20);
  }

  // ===== DARUMA: DRAG & DROP UNIFICADO (PC + Android) =====
  let contador = 0;
  const totalSemillas = 10;
  const semillasDiv = document.getElementById('semillas');
  const contadorSpan = document.getElementById('contador');
  const daruma = document.getElementById('daruma');
  const zonaDrop = document.getElementById('zonaDrop');
  const mensaje = document.getElementById('mensaje');
  const victoria = document.getElementById('victoria');
  const btnReiniciar = document.getElementById('btnReiniciar');

  // Variables para arrastre táctil/mouse unificado
  let currentDrag = null;      // semilla siendo arrastrada
  let seedClone = null;        // clon visual que sigue al cursor/dedo
  let dragStartPos = {x:0, y:0};
  let isDragging = false;

  function inicializarDaruma() {
    semillasDiv.innerHTML = '';
    for (let i = 0; i < totalSemillas; i++) {
      const semilla = document.createElement('div');
      semilla.className = 'semilla';
      semilla.textContent = '🌰';
      semilla.draggable = true;
      semilla.dataset.id = i;

      // === HTML5 Drag & Drop (PC con mouse) ===
      semilla.addEventListener('dragstart', (e) => {
        if (semilla.classList.contains('comida')) { e.preventDefault(); return; }
        e.dataTransfer.setData('text/plain', i);
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => semilla.classList.add('dragging'), 0);
      });
      semilla.addEventListener('dragend', () => {
        semilla.classList.remove('dragging');
      });

      // === Pointer events unificados (PC touch + Android) ===
      semilla.addEventListener('pointerdown', (e) => {
        if (semilla.classList.contains('comida')) return;
        // Solo iniciar si es touch o botón izquierdo
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        
        e.preventDefault();
        semilla.setPointerCapture(e.pointerId);
        
        currentDrag = semilla;
        isDragging = false;
        dragStartPos = { x: e.clientX, y: e.clientY };

        // Crear clon visual
        seedClone = document.createElement('div');
        seedClone.className = 'seed-clone';
        seedClone.textContent = '🌰';
        seedClone.style.left = e.clientX + 'px';
        seedClone.style.top = e.clientY + 'px';
        document.body.appendChild(seedClone);
      });

      semilla.addEventListener('pointermove', (e) => {
        if (currentDrag !== semilla) return;
        
        const dx = e.clientX - dragStartPos.x;
        const dy = e.clientY - dragStartPos.y;
        if (!isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
          isDragging = true;
          semilla.classList.add('dragging');
        }
        
        if (isDragging && seedClone) {
          seedClone.style.left = e.clientX + 'px';
          seedClone.style.top = e.clientY + 'px';
          
          // Detectar hover sobre zona drop
          const dropRect = zonaDrop.getBoundingClientRect();
          const overDrop = (
            e.clientX >= dropRect.left && e.clientX <= dropRect.right &&
            e.clientY >= dropRect.top && e.clientY <= dropRect.bottom
          );
          zonaDrop.classList.toggle('activo', overDrop);
        }
      });

      semilla.addEventListener('pointerup', (e) => {
        if (currentDrag !== semilla) return;
        
        semilla.releasePointerCapture(e.pointerId);
        
        if (isDragging) {
          // Verificar si se soltó sobre la zona del daruma
          const dropRect = zonaDrop.getBoundingClientRect();
          const overDrop = (
            e.clientX >= dropRect.left && e.clientX <= dropRect.right &&
            e.clientY >= dropRect.top && e.clientY <= dropRect.bottom
          );
          
          if (overDrop && !semilla.classList.contains('comida')) {
            alimentar(semilla);
          }
        } else {
          // Fue un tap simple, no arrastre → también alimentar
          if (!semilla.classList.contains('comida')) {
            alimentar(semilla);
          }
        }
        
        // Limpiar
        zonaDrop.classList.remove('activo');
        semilla.classList.remove('dragging');
        if (seedClone) {
          seedClone.remove();
          seedClone = null;
        }
        currentDrag = null;
        isDragging = false;
      });

      semilla.addEventListener('pointercancel', () => {
        zonaDrop.classList.remove('activo');
        semilla.classList.remove('dragging');
        if (seedClone) { seedClone.remove(); seedClone = null; }
        currentDrag = null;
        isDragging = false;
      });

      semillasDiv.appendChild(semilla);
    }
  }

  // Drag & drop nativo (PC mouse) - zona drop
  zonaDrop.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    zonaDrop.classList.add('activo');
  });
  zonaDrop.addEventListener('dragleave', (e) => {
    if (!zonaDrop.contains(e.relatedTarget)) zonaDrop.classList.remove('activo');
  });
  zonaDrop.addEventListener('drop', (e) => {
    e.preventDefault();
    zonaDrop.classList.remove('activo');
    const id = e.dataTransfer.getData('text/plain');
    const semilla = document.querySelector(`.semilla[data-id="${id}"]`);
    if (semilla && !semilla.classList.contains('comida')) {
      semilla.classList.remove('dragging');
      alimentar(semilla);
    }
  });

  function alimentar(semilla) {
    semilla.classList.add('comida');
    semilla.classList.remove('dragging');
    contador++;
    contadorSpan.textContent = contador;

    daruma.classList.remove('feliz');
    daruma.classList.add('comiendo');
    setTimeout(() => daruma.classList.remove('comiendo'), 600);
    vibrar(40);

    if (contador < totalSemillas) {
      const msgs = ['¡Ñam! 🌰','¡Rico! 😋','¡Más! 🤤','¡Delicioso! ✨','¡Otra! 🌟','¡Crece! 💪','¡Casi! 🎯','¡Ya! 🌸','¡Última! 🔥'];
      mensaje.textContent = msgs[contador - 1] || '¡Sigue!';
    }

    if (contador === totalSemillas) {
      mensaje.textContent = '';
      victoria.style.display = 'block';
      btnReiniciar.style.display = 'inline-block';
      daruma.classList.add('feliz');
      vibrar([50,50,80]);
    }
  }

  btnReiniciar.addEventListener('click', () => {
    contador = 0; contadorSpan.textContent = 0;
    victoria.style.display = 'none'; btnReiniciar.style.display = 'none';
    daruma.classList.remove('feliz', 'comiendo');
    mensaje.textContent = '¡Alimenta al daruma arrastrando las semillas!';
    document.querySelectorAll('.semilla').forEach(s => s.classList.remove('comida', 'dragging'));
    vibrar(20);
  });
</script>
</body>
</html>
